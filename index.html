<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Blink Games</title>
<meta name="description" content="Slow Blink Games is a small indie studio making games with care.">
<meta property="og:title" content="Slow Blink Games">
<meta property="og:description" content="A small indie studio making games with care.">
<meta property="og:url" content="https://slowblinkgames.com/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://slowblinkgames.com/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Slow Blink Games">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111111">
<link rel="icon" href="brand/avatar.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: Fredoka;
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url(fonts/fredoka.woff2) format("woff2");
  }
  @font-face {
    font-family: Nunito;
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
    src: url(fonts/nunito.woff2) format("woff2");
  }
  :root {
    --bg: #111111;
    --card: #1b1b1b;
    --line: #2a2a2a;
    --orange: #F7891F;
    --text: #f2ede6;
    --muted: #a39b91;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Nunito, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  a { color: var(--orange); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  header { text-align: center; padding: 72px 0 40px; }
  .mark { width: min(220px, 55vw); height: auto; display: block; margin: 0 auto 24px; }
  h1 {
    font-family: Fredoka, Nunito, sans-serif;
    font-weight: 600;
    color: var(--orange);
    font-size: clamp(34px, 8vw, 56px);
    letter-spacing: .04em;
    line-height: 1.1;
    margin: 0;
  }
  .games-word {
    font-family: Fredoka, Nunito, sans-serif;
    font-weight: 600;
    color: var(--orange);
    letter-spacing: .5em;
    margin: 10px 0 0 .5em;
    font-size: clamp(14px, 3vw, 20px);
  }
  .tagline { color: var(--muted); margin: 28px auto 0; max-width: 34em; }

  h2 {
    font-family: Fredoka, Nunito, sans-serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 16px;
  }
  section { padding: 32px 0; }
  .badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--orange);
    border: 1px solid var(--orange);
    border-radius: 999px;
    padding: 2px 12px;
  }

  .contact p { margin: 0; color: var(--muted); }
  .contact a { font-weight: 600; text-decoration: none; }
  .contact a:hover { text-decoration: underline; }

  footer {
    border-top: 1px solid var(--line);
    margin-top: 32px;
    padding: 24px 0 40px;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 610 600" role="img" aria-label="Slow Blink Games">
      <defs>
        <mask id="eyeMask">
          <rect width="610" height="600" fill="#fff"/>
          <path d="M482 144 Q497 158 512 144 Q497 158 482 144 Z" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
            <animate attributeName="d" dur="9s" begin="2s" repeatCount="indefinite"
              keyTimes="0;0.82;0.88;0.94;1" calcMode="spline"
              keySplines="0 0 1 1;.6 0 .4 1;.6 0 .4 1;0 0 1 1"
              values="M482 144 Q497 158 512 144 Q497 158 482 144 Z;M482 144 Q497 158 512 144 Q497 158 482 144 Z;M482 144 Q497 124 512 144 Q497 158 482 144 Z;M482 144 Q497 158 512 144 Q497 158 482 144 Z;M482 144 Q497 158 512 144 Q497 158 482 144 Z"/>
          </path>
        </mask>
      </defs>
      <g fill="#F7891F">
        <path fill="none" stroke="#F7891F" stroke-width="56" stroke-linecap="round"
          d="M288 150 C220 146 160 172 160 226 C160 280 230 300 262 350 C284 384 290 420 288 450 C284 510 240 532 180 532 C100 532 48 490 48 430 C48 370 96 336 140 344 C180 352 190 400 160 418 C140 430 124 420 126 404"/>
        <path fill-rule="evenodd" mask="url(#eyeMask)"
          d="M356 560 Q340 560 340 544 L340 118 L372 50 Q382 32 392 50 L412 96 L448 62 Q462 50 466 68 L474 106 Q510 120 530 160 Q542 178 532 192 Q520 214 500 220 C540 236 552 268 550 300 C548 330 530 350 506 356 C560 368 590 410 590 460 C590 520 546 560 490 560 Z
             M396 272 L440 272 C470 272 488 290 488 308 C488 326 470 344 440 344 L396 344 Z
             M396 398 L464 398 C504 398 530 422 530 454 C530 486 504 506 464 506 L396 506 Z"/>
      </g>
    </svg>
    <h1>SLOW BLINK</h1>
    <div class="games-word">GAMES</div>
    <p class="tagline">A small indie studio making games with care.</p>
  </header>

  <section>
    <h2>Games</h2>
    <span class="badge">Coming soon</span>
  </section>

  <section class="contact">
    <h2>Contact</h2>
    <p>Questions, feedback or press: <a href="mailto:hello@slowblinkgames.com">hello@slowblinkgames.com</a></p>
  </section>

  <footer>© 2026 Slow Blink Games</footer>
</div>
</body>
</html>
